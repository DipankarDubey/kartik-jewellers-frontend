name: Browser E2E UI tests
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-fund
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start Vite and run Chromium E2E
        run: |
          export VITE_API_URL=https://kartik-jewellers-api.onrender.com/api
          npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          node -e 'const http=require("http");let tries=0;const ping=()=>http.get("http://127.0.0.1:5173",r=>{r.resume();process.exit(0)}).on("error",()=>{if(++tries>30)process.exit(1);setTimeout(ping,1000)});ping()'
          node tests/browser-e2e.mjs

      - name: Exercise actual deployed storefront and auth guards
        if: github.event_name != 'pull_request'
        run: node tests/live-browser-smoke.mjs
